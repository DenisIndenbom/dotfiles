# Backend
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# Blur
blur: {
    method = "dual_kawase";
    size = 6;
    deviation = 3.0;
    strength = 5.0;
};

# Corners
corner-radius = 12;

# Frame opacity
frame-opacity = 0.9;

# Rules
rules = (
    # Desktop
    {
        match = "window_type = 'desktop'";
        corner-radius = 0;
        blur-background = false;
    },

    # Docks
    {
        match = "window_type = 'dock'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Dialogs
    {
        match = "window_type = 'dialog'";
        opacity = 0.92;
        blur-opacity = 0.7;
    },

    # Menus & Toolbars
    {
        match = "window_type *= 'menu' || window_type *= 'tooltip' || window_type = 'utility' || window_type = 'combo'";
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Non-standard windows
    {
        match = "_NET_WM_WINDOW_TYPE *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE' || window_type = 'unknown'";
        corner-radius = 0;
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Terminals, dialogs & other apps
    {
        match = "class_g *?= 'Alacritty' || class_g = 'Thunar' || class_g = 'Yad'";
        opacity = 0.90;
        blur-opacity = 0.7;
    },

    # Rofi
    {
        match = "class_g = 'Rofi'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
    },

    # Dunst
    {
        match = "class_g = 'Dunst'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
        animations = (
            {
                triggers = [ "open", "show" ];
                preset = "slide-in";
                direction = "right";
                duration = 0.15;
            },
            {
                triggers = [ "close", "hide" ];
                preset = "slide-out";
                direction = "right";
                duration = 0.12;
            },
            {
                triggers = [ "geometry" ];
                duration = 0.0;
            }
        );
    },

    # i3lock
    {
        match = "class_g = 'i3lock'";
        corner-radius = 0;
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Fullscreen
    {
        match = "fullscreen";
        opacity = 1.0;
        corner-radius = 0;
        blur-background = false;
    }
);

# Global animations
animations = (
    {
        triggers = [ "open" ];
        preset = "appear";
        duration = 0.20;
        scale = 0.96;
    },
    {
        triggers = [ "close" ];
        preset = "disappear";
        duration = 0.18;
        scale = 0.96;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.30;
        curve = "cubic-bezier(0.22, 1, 0.36, 1)";
    }
);