# Backend
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# Blur
blur: {
    method = "dual_kawase";
    size = 6;
    deviation = 3.0;
    strength = 5.0;
};

# Corners
corner-radius = 12;

# Frame opacity
frame-opacity = 0.9;

# Rules
rules = (
    # Screenshot & lock screen: no effects
    {
        match = "class_g = 'slop' || class_g = 'i3lock'";
        corner-radius = 0;
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Desktop: no blur, no corners
    {
        match = "window_type = 'desktop'";
        corner-radius = 0;
        blur-background = false;
    },

    # Panels & docks
    {
        match = "window_type = 'dock'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Notifications
    {
        match = "window_type = 'notification'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
        animations = (
            {
                triggers = [ "open", "show" ];
                preset = "slide-in";
                direction = "right";
                duration = 0.15;
            },
            {
                triggers = [ "close", "hide" ];
                preset = "slide-out";
                direction = "right";
                duration = 0.12;
            },
            {
                triggers = [ "geometry" ];
                duration = 0.0;
            }
        );
    },

    # Rofi launcher
    {
        match = "class_g = 'Rofi'";
        opacity = 0.90;
        blur-opacity = 0.7;
        corner-radius = 0;
    },

    # Terminals, dialogs & other apps
    {
        match = "class_g = 'Alacritty' || class_g = 'alacritty_floating' || class_g = 'Thunar' || class_g = 'Yad' || window_type = 'dialog'";
        opacity = 0.90;
        blur-opacity = 0.7;
    },

    # Context menus, toolbars & utilities: no blur, slight rounding
    {
        match = "window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo' || window_type = 'tooltip' || window_type = 'toolbar' || window_type = 'utility'";
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Fullscreen: no effects
    {
        match = "fullscreen";
        opacity = 1.0;
        corner-radius = 0;
        blur-background = false;
    }
);

# Global animations
animations = (
    {
        triggers = [ "open" ];
        preset = "appear";
        duration = 0.20;
        scale = 0.96;
    },
    {
        triggers = [ "close" ];
        preset = "disappear";
        duration = 0.18;
        scale = 0.96;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.30;
        curve = "cubic-bezier(0.22, 1, 0.36, 1)";
    }
);