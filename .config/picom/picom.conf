# Backend
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
unredir-if-possible-delay = 150;

# Generic window detection
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Blur
blur = {
    method = "dual_kawase";
    size = 6;
    strength = 5;
};

# Corners
corner-radius = 12;

# Frame opacity
frame-opacity = 0.9;

# Rules
rules = (
    # Base blur policy
    {
        blur-background = true;
    },

    # Desktop & Docks
    {
        match = "window_type = 'desktop' || window_type = 'dock'";
        corner-radius = 0;
        blur-background = false;
    },

    # GTK client-side decorated windows
    {
        match = "_GTK_FRAME_EXTENTS@";
        blur-background = false;
    },

    # Menus & Toolbars
    {
        match = "window_type *= 'menu' || window_type = 'tooltip' || window_type = 'utility' || window_type = 'combo' || window_type = 'toolbar' || window_type = 'splash' || window_type = 'notification' || window_type = 'dnd'";
        blur-background = false;
        corner-radius = 0;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Dialogs
    {
        match = "window_type = 'dialog'";
        opacity = 0.92;
        blur-opacity = 0.7;
        blur-background = true;
    },

    # Non-standard windows
    {
        match = "_NET_WM_WINDOW_TYPE *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE' || window_type = 'unknown'";
        corner-radius = 0;
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Terminals, dialogs & other apps
    {
        match = "class_g *?= 'Alacritty' || class_g = 'Thunar' || class_g = 'Yad'";
        opacity = 0.90;
        blur-opacity = 0.7;
        blur-background = true;
    },

    # Rofi
    {
        match = "class_g = 'Rofi'";
        opacity = 0.90;
        blur-opacity = 0.7;
        blur-background = true;
        corner-radius = 0;
    },

    # Dunst
    {
        match = "class_g = 'Dunst'";
        opacity = 0.90;
        blur-opacity = 0.7;
        blur-background = true;
        corner-radius = 0;
        animations = (
            {
                triggers = [ "open", "show" ];
                preset = "slide-in";
                direction = "right";
                duration = 0.15;
            },
            {
                triggers = [ "close", "hide" ];
                preset = "slide-out";
                direction = "right";
                duration = 0.12;
            },
            {
                triggers = [ "geometry" ];
                duration = 0.0;
            }
        );
    },

    # i3lock
    {
        match = "class_g = 'i3lock'";
        corner-radius = 0;
        blur-background = false;
        animations = (
            { triggers = [ "open", "close", "geometry" ]; duration = 0.0; }
        );
    },

    # Fullscreen
    {
        match = "fullscreen";
        opacity = 1.0;
        corner-radius = 0;
        blur-background = false;
    }
);

# Global animations
animations = (
    {
        triggers = [ "open" ];
        suppressions = [ "geometry" ];
        preset = "appear";
        duration = 0.20;
        scale = 0.96;
        blur-opacity = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.12;
            start = 0;
            end = "window-blur-opacity";
        };
    },
    {
        triggers = [ "close" ];
        suppressions = [ "geometry" ];
        preset = "disappear";
        duration = 0.18;
        scale = 0.96;
        blur-opacity = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.10;
            start = "window-blur-opacity-before";
            end = 0;
        };
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.30;
        curve = "cubic-bezier(0.22, 1, 0.36, 1)";
    }
);
