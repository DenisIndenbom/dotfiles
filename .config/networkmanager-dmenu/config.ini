[dmenu]
compact = True
highlight = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name} {sec} {icon}
pinentry = pinentry
prompt = 󰖩
dmenu_command = rofi -dmenu -i -theme ~/.config/rofi/dmenu.rasi

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = alacritty

[nmdm]
rescan_delay = 5
show_notifications = True
