[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/system.ini
include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/decor.ini
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
bottom = false
fixed-center = true

width = 100%
height = 35
offset-x = 0%
offset-y = 0%

background = ${colors.base}
foreground = ${colors.text}
radius = 0
border-size = 0
border-color = ${colors.base}

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=16;2

modules-left = workspaces
modules-center = date
modules-right = tray tray-toggle network bluetooth volume battery keyboard power sep

spacing = 1
dim-value = 1.0

enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/external]
inherit = bar/main
monitor = ${env:MONITOR:}
monitor-strict = true

modules-left = workspaces
modules-center =
modules-right = 

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
pseudo-transparency = false